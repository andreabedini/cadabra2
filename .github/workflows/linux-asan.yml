# Build the core (no frontend) with AddressSanitizer and run the test
# suite, to catch memory errors (out-of-bounds accesses, use-after-free,
# ...) in the C++ core and the bundled xPerm code.

name: Linux ASan

on: [push, pull_request]

jobs:
  asan:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: get dependencies
      run:  sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install ninja-build git cmake python3-dev g++ libpcre3 libpcre3-dev libgmp3-dev libglibmm-2.68-dev libboost-all-dev libgmp-dev libsqlite3-dev uuid-dev libmpfr-dev libmpc-dev libssl-dev catch2 && python3 -m pip install --upgrade pip && python3 -m pip install wheel && python3 -m pip install sympy gmpy2 numpy

    - name: configure
      run:  >
        mkdir build && cd build && cmake -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O0"
        -DENABLE_MATHEMATICA=OFF
        -DENABLE_FRONTEND=OFF
        -DENABLE_PY_JUPYTER=OFF
        -DCADABRA_TEST_TIMEOUT=600
        ..

    - name: build
      run:  cd build && cmake --build .

    - name: test
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
        # Leak detection is off: the Python interpreter and the global
        # name/rational tables are never freed on exit.
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      run: |
        # The test driver is a Python-embedding binary; the ASan runtime
        # must be loaded first so that Python extension modules built
        # with ASan can be imported.
        export LD_PRELOAD=$(gcc -print-file-name=libasan.so)
        cd build && ctest -j2 --output-on-failure
